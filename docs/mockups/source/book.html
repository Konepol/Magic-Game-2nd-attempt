<style>
:root{--void:#07041a;--page:#241549;--page2:#150c33;--glow:#c79bff;--glow2:#e9c9ff;--ink:#efe6ff;--dim:#a999d6;--line:#5a45a8;--cy:#6fe3ff;--mint:#7be8b5;--warn:#ff6b8a;--gold:#f2c879}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;overflow:hidden;background:var(--void);font-family:'Alegreya Sans',sans-serif;color:var(--ink);position:relative}
canvas{position:absolute;inset:0}
#fx{z-index:6;pointer-events:none}
.rays{position:absolute;left:50%;top:48%;width:2200px;height:2200px;margin:-1100px 0 0 -1100px;background:repeating-conic-gradient(from 0deg,rgba(190,140,255,.0) 0 6deg,rgba(190,140,255,.09) 7deg 8deg,rgba(190,140,255,0) 9deg 14deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
.circle{position:absolute;left:50%;top:50%;width:1500px;height:1500px;margin:-750px 0 0 -750px;opacity:.55}
.circle svg{width:100%;height:100%}
.bookwrap{position:absolute;left:118px;top:70px;width:1260px;height:860px;z-index:3}
.stackL,.stackR{position:absolute;top:18px;bottom:6px;width:50%;border-radius:14px}
.edge{position:absolute;top:0;bottom:0;border-radius:12px;background:linear-gradient(180deg,#2c1b5c,#160d36);border:1px solid #4a3890}
.book{position:absolute;inset:10px 22px;display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 0 60px rgba(150,100,255,.7))}
.pg{position:relative;padding:22px 30px 20px;background:
 radial-gradient(ellipse at 50% -10%,rgba(200,150,255,.38),transparent 55%),
 radial-gradient(ellipse at 100% 100%,rgba(120,80,230,.25),transparent 55%),
 linear-gradient(180deg,var(--page),var(--page2));overflow:hidden;border:1px solid #6a52c0}
.pg.l{border-radius:14px 0 0 14px;box-shadow:inset -40px 0 50px -30px rgba(220,170,255,.55),inset 0 0 70px rgba(130,90,240,.3);transform:perspective(1600px) rotateY(2.5deg);transform-origin:right}
.pg.r{border-radius:0 14px 14px 0;box-shadow:inset 40px 0 50px -30px rgba(220,170,255,.55),inset 0 0 70px rgba(130,90,240,.3);transform:perspective(1600px) rotateY(-2.5deg);transform-origin:left}
.pg::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .8 0 0 0 0 .6 0 0 0 0 1 0 0 0 .09 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");mix-blend-mode:screen;pointer-events:none}
.frame{position:absolute;inset:9px;border:1px solid rgba(199,155,255,.55);border-radius:8px;pointer-events:none;box-shadow:inset 0 0 0 4px rgba(20,10,50,.6),inset 0 0 0 5px rgba(199,155,255,.25)}
.corner{position:absolute;width:56px;height:56px;color:var(--glow);filter:drop-shadow(0 0 5px var(--glow))}
.corner.tl{left:6px;top:6px}.corner.tr{right:6px;top:6px;transform:scaleX(-1)}.corner.bl{left:6px;bottom:6px;transform:scaleY(-1)}.corner.br{right:6px;bottom:6px;transform:scale(-1,-1)}
.runes{font-family:'Noto Sans Runic';font-size:14px;letter-spacing:.5em;text-align:center;color:var(--gold);text-shadow:0 0 10px rgba(242,200,121,.8);opacity:.9;display:flex;align-items:center;gap:10px;justify-content:center;margin:2px 24px 8px}
.runes::before,.runes::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
h2{font-family:'Almendra',serif;font-size:42px;line-height:1;color:var(--glow2);text-shadow:0 0 18px rgba(199,155,255,.95),0 0 3px #fff3}
.sub{color:var(--dim);font-size:15px;font-style:italic;margin-top:2px}
h4{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.2em;color:var(--glow);margin:12px 0 7px;display:flex;align-items:center;gap:10px;text-shadow:0 0 8px rgba(199,155,255,.7)}
h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.glyph{width:36px;height:36px;flex:none;color:var(--glow2);filter:drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 12px rgba(160,100,255,.8))}
.glyph *{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.glyph .f{fill:rgba(220,180,255,.35)}
.card{position:relative;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(130,90,230,.16),rgba(60,30,130,.12));box-shadow:inset 0 0 18px rgba(150,100,255,.12)}
.wand{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;padding:8px 14px;height:92px;overflow:hidden}
.wand b,.slot b,.q b,.rep b{font-family:'Almendra',serif;font-size:23px;line-height:1;color:var(--ink);text-shadow:0 0 9px rgba(190,150,255,.6)}
.wand span{font-size:13px;color:var(--dim);display:block;margin-top:4px}
.wand .held{color:var(--cy);text-shadow:0 0 8px rgba(111,227,255,.7)}
.btn{border:1px solid var(--glow);color:var(--glow2);padding:7px 14px;border-radius:7px;font-weight:700;font-size:13px;letter-spacing:.04em;background:rgba(199,155,255,.12);box-shadow:0 0 14px rgba(199,155,255,.4),inset 0 0 8px rgba(199,155,255,.25);white-space:nowrap}
.slot{display:grid;grid-template-columns:44px 40px 1fr auto auto;gap:10px;align-items:center;height:47px;margin-bottom:5px;padding:0 12px 0 6px}
.slot.sel{border-color:var(--glow2);box-shadow:0 0 0 1px var(--glow),0 0 24px rgba(190,140,255,.6),inset 0 0 22px rgba(190,140,255,.25)}
.slot .glyph{width:30px;height:30px}
.k{font-family:'Cinzel',serif;font-size:11px;font-weight:700;text-align:center;color:var(--gold);border:1px solid rgba(242,200,121,.7);border-radius:5px;padding:3px 0;background:rgba(242,200,121,.08);box-shadow:0 0 8px rgba(242,200,121,.3)}
.slot em{font-style:normal;font-size:12px;color:var(--dim)}
.pips{display:flex;gap:3px}.pips i{width:6px;height:6px;border-radius:50%;background:#33265f}.pips i.on{background:var(--cy);box-shadow:0 0 6px var(--cy)}
.slot.lock{opacity:.5;border-style:dashed}
.lockic{width:22px;height:22px;color:#8a7bc0}.lockic *{fill:none;stroke:currentColor;stroke-width:1.6}
.note{font-size:12.5px;color:var(--dim);border-left:2px solid var(--glow);padding-left:9px;margin-top:6px;font-style:italic}
.scribble{position:absolute;left:30px;right:30px;bottom:34px;height:108px;opacity:.9}
.scribble path{fill:none;stroke:#cfa8ff;stroke-width:1.4;stroke-linecap:round;filter:drop-shadow(0 0 3px #b98aff)}
.folk{position:absolute;left:30px;right:30px;bottom:46px}
.meds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.med{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 6px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(130,90,230,.16),rgba(60,30,130,.1))}
.med svg{width:40px;height:40px;color:var(--glow2);filter:drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 10px rgba(160,100,255,.7))}
.med svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.med svg .f{fill:rgba(220,180,255,.35)}
.med span{font-size:12px;color:var(--ink);text-align:center;line-height:1.1}
.med.lk{opacity:.5;border-style:dashed}.med.lk svg{color:#8a7bc0;filter:none}
.folio{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-size:12px;color:var(--gold);letter-spacing:.3em;text-shadow:0 0 8px rgba(242,200,121,.7)}
.hero{display:grid;grid-template-columns:auto 1fr 190px;gap:14px;align-items:center}
.hero .glyph{width:64px;height:64px}
.art{height:96px;position:relative}
.eff{padding:10px 14px 12px}
.eff .big{font-family:'Almendra',serif;font-size:28px;color:var(--glow2);text-shadow:0 0 12px rgba(199,155,255,.8)}
.eff p{font-size:14px;color:var(--dim)}
.gauge{height:14px;border-radius:7px;position:relative;margin:10px 0 3px;background:linear-gradient(90deg,var(--cy) 0 45%,var(--glow) 45% 70%,var(--warn) 70%);box-shadow:0 0 16px rgba(160,110,255,.7);border:1px solid rgba(255,255,255,.3)}
.gauge i{position:absolute;left:56%;top:-6px;width:4px;height:26px;border-radius:2px;background:#fff;box-shadow:0 0 12px #fff}
.ticks{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--dim);font-family:'Cinzel',serif}
.tag{display:inline-block;margin-top:7px;padding:2px 10px;border-radius:99px;font-size:11.5px;background:rgba(111,227,255,.1);color:var(--cy);border:1px solid rgba(111,227,255,.45);text-shadow:0 0 6px rgba(111,227,255,.6)}
.q{padding:9px 14px 10px;margin-bottom:7px;display:grid;grid-template-columns:34px 1fr;gap:12px}
.q.on{border-color:var(--glow2);box-shadow:0 0 0 1px var(--glow),0 0 24px rgba(190,140,255,.5)}
.q .ic{width:34px;height:34px;color:var(--gold);filter:drop-shadow(0 0 6px rgba(242,200,121,.8))}.q .ic *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.q .nx{font-size:13.5px;color:var(--dim);margin:3px 0 6px}.q .nx strong{color:var(--ink);font-weight:500}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}.row b{color:var(--cy);font-weight:700;text-shadow:0 0 8px rgba(111,227,255,.8)}
.bar{height:9px;border-radius:5px;background:#1a1040;border:1px solid #3a2a78;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fb8e0,var(--cy));box-shadow:0 0 12px var(--cy)}
.rep{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;padding:7px 12px;margin-bottom:6px}
.sigil{width:36px;height:36px;color:var(--glow2);filter:drop-shadow(0 0 6px var(--glow))}.sigil *{fill:none;stroke:currentColor;stroke-width:1.5}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(255,107,138,.12);color:#ff9bb0;border:1px solid rgba(255,107,138,.45)}
.chip.ok{background:rgba(123,232,181,.1);color:var(--mint);border-color:rgba(123,232,181,.4)}
.tabs{position:absolute;left:1378px;top:120px;z-index:4;display:flex;flex-direction:column;gap:10px}
.tab{width:128px;height:48px;padding:0 14px;display:flex;align-items:center;gap:9px;border-radius:0 12px 12px 0;background:linear-gradient(90deg,#1c1048,#2e1c68);border:1px solid #5a45a8;border-left:0;font-family:'Almendra',serif;font-size:17px;color:var(--glow);box-shadow:0 0 14px rgba(120,80,230,.35)}
.tab svg{width:20px;height:20px;flex:none}.tab svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{width:146px;margin-left:-16px;background:linear-gradient(90deg,#9a6bef,#d4a8ff);color:#1a0d3a;border-color:#f0d8ff;box-shadow:0 0 28px rgba(210,160,255,.9)}
.ribbon{position:absolute;left:617px;top:700px;width:26px;height:140px;background:linear-gradient(90deg,#8a1f5a,#c43a86);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);z-index:5;box-shadow:0 0 14px #c43a86;opacity:.95}
.hints{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:28px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:4}
.hints kbd{font-family:'Cinzel',serif;border:1px solid var(--gold);border-radius:5px;padding:2px 8px;margin-right:6px;color:var(--gold);box-shadow:0 0 8px rgba(242,200,121,.4)}
.title{position:absolute;left:36px;top:24px;z-index:4;font-family:'Almendra',serif;font-size:30px;color:#e7cbff;text-shadow:0 0 18px #9b6bff}.title small{display:block;font-family:'Alegreya Sans';font-size:14px;color:var(--dim);letter-spacing:.1em;text-shadow:none}
.tl{display:none}
.sw2{display:inline-block;width:42px;height:22px;border-radius:11px;border:1px solid #5a45a8;background:#1a1236;position:relative;vertical-align:middle}.sw2.on{background:rgba(111,227,255,.25);border-color:#6fe3ff}.sw2::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#a999d6}.sw2.on::after{left:22px;background:#6fe3ff}
.seg2{display:inline-flex;border:1px solid #5a45a8;border-radius:7px;overflow:hidden}.seg2 i{font-style:normal;padding:4px 10px;font-family:Cinzel;font-size:11px;color:#a999d6;border-right:1px solid #3a2f78}.seg2 i:last-child{border:0}.seg2 i.on{background:#c79bff;color:#1a0d3a;font-weight:700}
.sl2{display:inline-block;width:150px;height:7px;border-radius:4px;background:#2e2560;vertical-align:middle}.sl2 b{display:block;height:7px;border-radius:4px;background:linear-gradient(90deg,#6fe3ff,#c79bff)}
.set2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;min-height:50px;border-bottom:1px solid #2e2560;font-size:15px}.set2 small{display:block;color:var(--dim);font-size:12px}.set2 .ctl{display:flex;gap:10px;align-items:center}.set2 em{font-style:normal;color:var(--dim);font-size:12px}
.fx{list-style:none;padding:0;margin:0}.fx li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #2e2560;font-size:14px}.fx li span:last-child{color:var(--dim);text-align:right}
.repbar{position:relative;height:10px;border-radius:5px;margin:10px 0 4px}.repbar i{position:absolute;top:-4px;width:4px;height:18px;background:#fff;box-shadow:0 0 8px #fff;border-radius:2px;transform:translateX(-2px)}
.tiers{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-family:Cinzel;letter-spacing:.08em}
.avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#59607f,#262a47);border:1px solid var(--gold);display:grid;place-items:center;font-family:Almendra;font-size:22px;color:var(--gold)}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td{padding:6px 4px;border-bottom:1px solid #2e2560;text-align:center}.tb td:first-child{text-align:left;color:var(--dim)}
.lib2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;text-align:center}.lcard b{font-family:Almendra;font-size:18px;line-height:1.1}.lcard span{font-size:12px;color:var(--dim)}.sel2{border-color:var(--glow2)!important;box-shadow:0 0 0 1px var(--glow),0 0 18px rgba(190,140,255,.5)}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.18);font-size:14px}.form b{display:block;font-family:Cinzel;letter-spacing:.1em;font-size:12px;color:var(--gold);margin-bottom:2px}.spell-head{display:flex;gap:14px;align-items:center}
.q .nx{font-size:13.5px;color:var(--dim);margin:3px 0 6px}.q .nx strong{color:var(--ink);font-weight:500}.q b{font-family:Almendra;font-size:21px}
.sigil{width:36px;height:36px;color:var(--glow2)}.sigil *{fill:none;stroke:currentColor;stroke-width:1.5}
.lockic{width:22px;height:22px;color:#8a7bc0}.lockic *{fill:none;stroke:currentColor;stroke-width:1.6}
.clue{padding:10px 12px;border:1px dashed var(--gold);border-radius:8px;margin-bottom:8px;font-family:Almendra;font-size:18px;font-style:italic;background:rgba(217,180,90,.06)}.clue small{display:block;font-family:"Alegreya Sans";font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}</style>

<script>
let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
/* background: nebula, stars */

settings(){tabsOn(5);

 const R=chrome('ᛈᛉᛊᛏᛒ ᛖᛗᛚ',`<h4 style="margin-top:0">INTERFACE</h4>`+set('HUD layout','',seg(['Grimoire Glass','Anime Clean'],0))+set('Crosshair','Look of each part',`<span class="btn">Customize</span>`)+set('Output display','',seg(['Arc','Ticks','Beads','Tube','Gem'],0))+set('Health display','',seg(['Vial','Bar'],0))+`<h4>WORLD</h4>`+set('Time of day','Skip from here',seg(['Day','Night'],0))+set('Difficulty','',seg(['Easy','Normal','Hard'],1))+`<h4>SOUND AND CONTROLS</h4>`+set('Songs','',slider(70))+set('Effects','',slider(85))+set('Voices','',slider(80))+set('Key bindings','',`<span class="btn">Open</span>`)+`<div class="note">Saving is automatic, anywhere.</div>`,'II');return[L,R]},
wands(){tabsOn(0);
 const W=[['Teacher\'s Starter Wand',5,'Held cast: pause a chant and keep it ready.','#6fe3ff','Equipped'],['Oakheart Wand',3,'Spells cast from it cost slightly less mana.','#7be8b5',''],['Moonshard Wand',1,'One spell, no fusion, boosted far above normal.','#d49bff','']];
 const L=chrome('ᛋᛏᛒᛖᛗ ᛚᛜᛞ',`<h2>Change wand</h2><div class="sub">Each wand has its own slots and one unique ability.</div>`+W.map((w,i)=>`<div class="card wand" style="grid-template-columns:130px 1fr auto;margin-bottom:8px;${i==2?'border-color:var(--glow2);box-shadow:0 0 0 1px var(--glow),0 0 22px rgba(190,140,255,.5)':''}">${wandSvg(120,w[3])}<div><b>${w[0]}</b><span>${w[1]} slot${w[1]>1?'s':''} · ${w[2]}</span></div>${w[4]?`<span class="chip mana">${w[4]}</span>`:i==2?'<span class="chip">Selected</span>':''}</div>`).join('')+`<div class="note">The strongest wands come from the hardest secret quests.</div>`,'I');
 const R=chrome('ᚠᚢᚦᚨᚱᚲ ᚷᚹ',`<h2>Moonshard Wand</h2><div class="sub">One spell. Nothing else.</div><div class="card" style="padding:12px 14px"><ul class="fx" style="margin:0"><li><span>Slots</span><span>1</span></li><li><span>Fusion</span><span>Not possible</span></li><li><span>Multicast</span><span>Not possible</span></li><li><span>Spell strength</span><span style="color:var(--cy)">Far above normal</span></li><li><span>Cost</span><span>High mana or long cast</span></li></ul></div><h4>YOUR SLOTS AFTER CHANGING</h4><div class="card slot sel" style="grid-template-columns:44px 40px 1fr auto"><span class="k">LMB</span>${gl('moon')}<b>Hollow Moon</b><em>boosted</em></div><div class="card" style="padding:12px 14px;margin-top:8px;border-color:rgba(255,107,138,.6)"><b style="font-family:'Almendra';font-size:20px;color:#ff9bb0">4 spells leave your slots</b><div style="display:flex;gap:10px;margin:8px 0">${['weaver','bloom','step','lantern'].map(g=>gl(g)).join('')}</div><div style="font-size:13px;color:var(--dim)">They return to your library. Swap back any time at no cost.</div></div><div style="display:flex;gap:10px;margin-top:12px"><span class="btn">Cancel</span><span class="btn" style="background:rgba(199,155,255,.3)">Equip wand</span></div>`,'II');return[L,R]},
fusions(){tabsOn(0);
 const rec=(ing,res,known,hint)=>`<div class="card" style="padding:10px 14px;margin-bottom:8px;${known?'border-color:var(--glow2);box-shadow:0 0 0 1px var(--glow)':''}"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${ing.map((g,i)=>(i?'<span style="color:var(--gold);font-size:20px">+</span>':'')+gl(g)).join('')}<span style="color:var(--gold);font-size:20px">=</span><svg class="glyph" style="${known?'':'color:#6a5a9a;filter:none'}"><use href="#${known?'g-moon':'g-unk'}"/></svg><b style="font-family:'Almendra';font-size:22px;margin-left:6px;${known?'':'color:var(--dim);letter-spacing:.2em'}">${res}</b><span class="chip ${known?'mana':'dim'}" style="margin-left:auto">${known?'Known':'Locked'}</span></div><div style="font-size:13px;color:var(--dim);margin-top:6px;font-style:italic">${hint}</div></div>`;
 const L=chrome('ᛊᛏᛒᛖᛗ ᛚᛜᛞ',`<h2>Fusion recipes</h2><div class="sub">Each fusion is an entirely new spell. Recipes show first and unlock by doing.</div>`+rec(['weaver','moon'],'Eclipse Thread',true,'Placeholder name. Learned from the teacher\'s notes.')+rec(['bloom','lantern'],'???',false,'Clue: "Light behind glass bends where the lantern is not."')+rec(['step','weaver','lantern'],'???',false,'Try the combination near the ruins gate.')+rec(['moon','bloom','step','weaver'],'???',false,'Four ingredients. A rumor says a master knows it.'),'I');
 const R=chrome('ᛋᛏᛒᛖᛗ ᛚᛜᛞᛟ',`<h2>Eclipse Thread</h2><div class="sub">Weaver + Hollow Moon · placeholder design</div><div class="card" style="padding:12px 14px;font-size:14px;color:var(--ink)">A black thread unspools from the wand and pulls a thin moon down onto its target. It does not simply add the two spells together. It is its own spell, with its own shape, sound and camera.</div><h4>HOW TO CAST</h4><div class="card" style="padding:12px 14px"><div class="row"><span>Fuse live with B</span><b style="color:var(--mint)">28 mana</b></div><div class="row"><span>Equip it in a slot</span><b style="color:var(--gold)">40 mana</b></div><div style="font-size:12.5px;color:var(--dim);margin-top:6px">Pre-fusing costs more mana than fusing on the spot. Live fusing has a 15 second timer.</div></div><h4>EQUIP IN A SLOT</h4><div class="card slot" style="grid-template-columns:44px 40px 1fr auto"><span class="k">1</span>${gl('bloom')}<b>Mirror Bloom</b><em>replace</em></div><div class="card slot" style="grid-template-columns:44px 40px 1fr auto;margin-top:4px;opacity:.55"><span class="k">4</span><svg class="lockic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11 V8 a4 4 0 0 1 8 0 V11"/></svg><b style="color:var(--dim)">Locked</b><em>bigger wand</em></div><div style="display:flex;gap:10px;margin-top:12px"><span class="btn">Equip as slot spell</span></div>`,'II');return[L,R]},
spell(){tabsOn(0);
 const lib=['weaver','moon','bloom','step','lantern'],nm=['Weaver','Hollow Moon','Mirror Bloom','Veil Step','Lantern'];
 const L=chrome('ᚠᚢᚦᚨᚱ ᚲᚷᚹᚺ',`<h2>Spell library</h2><div class="sub">Pick a spell to read it. Pick a slot first to equip it.</div><div class="lib2">`+lib.map((g,i)=>`<div class="card lcard ${i==0?'sel2':''}">${gl(g)}<b>${nm[i]}</b><span>${[62,18,41,77,30][i]}% mastery</span></div>`).join('')+`</div><h4>FOLK SPELLS</h4><div class="meds">${['Warm water','Grow flowers','Calm animal','Mend crack'].map(n=>`<div class="med"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="10"/></svg><span>${n}</span></div>`).join('')}</div><div class="note">Folk spells never make you stronger. They reward exploring.</div>`,'I');
 const R=chrome('ᚠᚢᚦᚨᚱ ᚲᚷ',`<div class="spell-head">${gl('weaver').replace('class="glyph"','class="glyph" style="width:60px;height:60px"')}<div><h2>Weaver</h2><div class="sub" style="margin:0">Thread · basic attack</div></div></div><div class="forms" style="margin-top:12px"><div class="form"><b>TAP</b>A thread snakes in a lazy S-curve and stitches to the target.</div><div class="form"><b>HOLD · CHANT</b>Stitch several threads. On release they snap tight and yank targets together.</div></div><h4>WHAT MANA OUTPUT DOES TO THIS SPELL</h4><div class="card" style="padding:10px 14px"><table class="tb"><tr><td>Output</td><td>Low</td><td>Mid</td><td>High</td><td>Extreme</td></tr><tr><td>Threads</td><td>1</td><td>3</td><td>5</td><td>7</td></tr><tr><td>Snap force</td><td>×1.0</td><td>×1.5</td><td>×2.0</td><td>×2.6</td></tr></table></div><h4>BACKFIRE · THIS SPELL ONLY</h4><div class="card" style="padding:10px 14px"><div class="gauge" style="margin-top:2px"><div class="safe" style="width:40%"></div><div class="costly" style="left:40%;width:30%"></div><div class="over" style="width:30%"></div><div class="cursor" style="left:70%;background:#ff6b8a"></div></div><div class="ticks"><span>SAFE</span><span>COSTLY</span><span>BACKFIRE FROM 70</span></div><div style="font-size:12.5px;color:var(--dim);margin-top:6px">Past this point Weaver damages you. A perfect cast removes the chance of failing.</div></div><h4>MASTERY</h4><div class="row"><span>Chant time</span><b>1.1 s → 0.8 s</b></div>${pct(62)}<div class="note" style="margin-top:10px">Lantern has no backfire. It only costs more mana as output rises.</div>`,'II');return[L,R]}
};
function renderBook(k){const[L,R]=PAGES[k]();document.getElementById('L').innerHTML=L;document.getElementById('R').innerHTML=R}
renderBook(location.hash.slice(1)||'quests');
</script>
</body>
