<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya+Sans:wght@400;500;700&family=Noto+Sans+Runic&family=Cinzel:wght@500;700&family=Nunito:wght@500;700;800&family=Rajdhani:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;overflow:hidden;background:#0a0716;font-family:'Alegreya Sans',sans-serif;color:#efe6ff}
header{height:62px;padding:16px 30px 0;display:flex;align-items:baseline;gap:18px}
header h1{font-family:'Almendra';font-size:30px;color:#e7cbff;text-shadow:0 0 14px #9b6bff}
header span{color:#a999d6;font-size:15px}
.cols{display:grid;gap:10px;padding:0 30px}
.colh{font-family:'Cinzel';font-size:12px;letter-spacing:.16em;color:#a999d6;text-align:center;padding-bottom:2px}
.row{display:grid;gap:10px;align-items:center}
.lab{padding-right:6px}.lab b{font-family:'Almendra';font-size:24px;color:#e7cbff;display:block;line-height:1}.lab i{font-family:'Cinzel';font-style:normal;color:#f2c879;font-size:13px;letter-spacing:.1em}.lab p{font-size:13px;color:#a999d6;margin-top:5px;line-height:1.25}
.tile{background:radial-gradient(ellipse at 50% 50%,#2a2060,#0d0a24);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tile svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:#cdbff0;padding:5px 2px 0;height:34px}.cap b{color:#f2c879;font-family:'Cinzel';letter-spacing:.08em;margin-right:6px}
.gl *{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cust{display:grid;grid-template-columns:430px 590px 1fr;gap:14px;padding:0 30px;margin-top:14px;align-items:start}
.panel{background:linear-gradient(180deg,#241549,#150c33);border:1px solid #5a45a8;border-radius:12px;padding:14px 16px;min-height:420px}
.panel h3{font-family:'Almendra';font-size:22px;color:#e7cbff;font-weight:400;margin-bottom:6px;text-shadow:0 0 10px #9b6bff}
.srow{display:grid;grid-template-columns:130px auto 1fr;gap:10px;align-items:center;height:42px;border-bottom:1px solid #2e2560;font-size:14px}
.srow em{font-style:normal;color:#a999d6;font-size:12px}
.chips{display:inline-flex;gap:4px}.chips i{font-style:normal;width:26px;height:24px;border:1px solid #5a45a8;border-radius:6px;display:grid;place-items:center;font-family:Cinzel;font-size:11px;color:#a999d6}
.chips i.on{background:#c79bff;color:#1a0d3a;border-color:#f0d8ff;box-shadow:0 0 10px #c79bff}
.sl{display:block;width:104px;height:6px;border-radius:3px;background:#2e2560}.sl b{display:block;height:6px;border-radius:3px;background:#c79bff}
.sw2{width:40px;height:20px;border-radius:10px;border:1px solid #5a45a8;background:#1a1236;position:relative}.sw2.on{background:rgba(111,227,255,.25);border-color:#6fe3ff}.sw2::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#a999d6}.sw2.on::after{left:22px;background:#6fe3ff}
.btn2{border:1px solid #c79bff;color:#e9c9ff!important;padding:3px 12px;border-radius:6px;text-align:center}
.pres{display:grid;gap:10px}.pc{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}.pc b{font-family:'Almendra';font-size:20px;color:#e7cbff;font-weight:400}.pc p{font-size:12px;color:#a999d6}
.note2{background:rgba(120,80,220,.12);border:1px solid #5a45a8;border-radius:10px;padding:14px;font-size:14px;color:#cdbff0;height:200px}.note2 b{font-family:'Almendra';font-size:20px;color:#f2c879;font-weight:400;display:block;margin-bottom:6px}
</style>
<body><div id="app"></div>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur3"><feGaussianBlur stdDeviation="4"/></filter><filter id="blur8"><feGaussianBlur stdDeviation="9"/></filter>
 <radialGradient id="orbG"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
 <radialGradient id="orbC"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#6fe3ff"/><stop offset="1" stop-color="#6fe3ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="orbV"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#d49bff"/><stop offset="1" stop-color="#d49bff" stop-opacity="0"/></radialGradient>
 <radialGradient id="bgT" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#2a2060"/><stop offset="1" stop-color="#0d0a24"/></radialGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1f6b"/><stop offset=".55" stop-color="#9a6fc8"/><stop offset="1" stop-color="#f0b6a0"/></linearGradient>
 <symbol id="g-weaver" viewBox="0 0 44 44"><path d="M5 36 C13 8,22 42,30 14 S41 22,40 9"/><circle cx="40" cy="9" r="3"/></symbol>
 <symbol id="g-moon" viewBox="0 0 44 44"><path d="M30 6 A16 16 0 1 0 38 32 A13 13 0 1 1 30 6Z"/><circle cx="22" cy="22" r="19"/></symbol>
 <symbol id="g-bloom" viewBox="0 0 44 44"><path d="M22 24 C14 14,16 6,22 3 C28 6,30 14,22 24Z"/><path d="M22 24 C30 18,39 20,41 26 C36 33,28 32,22 24Z"/><path d="M22 24 C14 18,5 20,3 26 C8 33,16 32,22 24Z"/><path d="M22 24 C18 32,18 38,22 42 C26 38,26 32,22 24Z"/></symbol>
 <symbol id="g-step" viewBox="0 0 44 44"><path d="M4 34 L16 22 L10 18 L24 6 L20 18 L30 20 L18 34Z"/><path d="M26 38 L34 30 M30 41 L41 30"/></symbol>
 <symbol id="g-lantern" viewBox="0 0 44 44"><path d="M16 12 H28 L31 18 V32 L27 39 H17 L13 32 V18Z"/><path d="M22 3 V12 M18 18 H26"/><circle cx="22" cy="26" r="3.5"/></symbol>
</defs></svg>
<script>
const P=Math.PI/180,f=n=>(+n).toFixed(1);
const pt=(r,a,cx,cy)=>[cx+r*Math.sin(a*P),cy-r*Math.cos(a*P)];
const arc=(r,a0,a1,cx=120,cy=120)=>{const p0=pt(r,a0,cx,cy),p1=pt(r,a1,cx,cy);return `M${f(p0[0])} ${f(p0[1])}A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${f(p1[0])} ${f(p1[1])}`};
const S=(w,h,inner,bg='')=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${bg}${inner}</svg>`;
const gly=(id,x,y,s,col)=>`<svg class="gl" x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" style="color:${col}"><use href="#${id}"/></svg>`;
const star=(x,y,r,col,op=1)=>`<path d="M${x} ${y-r}L${x+r*.28} ${y-r*.28}L${x+r} ${y}L${x+r*.28} ${y+r*.28}L${x} ${y+r}L${x-r*.28} ${y+r*.28}L${x-r} ${y}L${x-r*.28} ${y-r*.28}Z" fill="${col}" opacity="${op}"/>`;
const stars=(w,h,n,seed)=>{let s=seed,o='';const R=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let i=0;i<n;i++)o+=`<circle cx="${f(R()*w)}" cy="${f(R()*h)}" r="${f(.4+R()*1.1)}" fill="#fff" opacity="${f(.2+R()*.6)}"/>`;return o};
const tileBg=(w,h,seed)=>`<rect width="${w}" height="${h}" fill="url(#bgT)"/>`+stars(w,h,50,seed)+`<path d="M0 ${h-40} Q${w*.3} ${h-70} ${w*.5} ${h-45} T${w} ${h-55} V${h}H0Z" fill="#120c30" opacity=".8"/>`;
const enemy=(x,y,s,c='#1a1030')=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="22" ry="14" fill="${c}"/><path d="M-20 -4L-60 -22L-34 6ZM20 -4L60 -22L34 6Z" fill="${c}"/><circle cx="-6" cy="-3" r="2.5" fill="#ff5a7a"/><circle cx="6" cy="-3" r="2.5" fill="#ff5a7a"/></g>`;
const fig=(x,y,s,c,op=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" opacity="${op}"><path d="M-14 -52L0 -92L14 -52Z"/><ellipse cx="0" cy="-52" rx="24" ry="6"/><circle cx="0" cy="-42" r="11"/><path d="M-24 0L-12 -30H12L24 0Z"/></g>`;
const row=(cols,n)=>`display:grid;grid-template-columns:${cols}`;

/* ====== 3. MANA SENSING ====== */
const flame=(x,y,h,w,c1,c2,seed)=>{let o='';for(let i=0;i<9;i++){const t=(i-4)/4,hh=h*(.55+.45*Math.abs(Math.sin(seed+i*1.9)))*(1-.35*Math.abs(t)),bx=x+t*w;o+=`<path d="M${f(bx-w/9)} ${y}C${f(bx-w/6)} ${f(y-hh*.5)} ${f(bx+w/10*Math.sin(i))} ${f(y-hh*.8)} ${f(bx)} ${f(y-hh)}C${f(bx+w/6)} ${f(y-hh*.6)} ${f(bx+w/9)} ${f(y-hh*.3)} ${f(bx+w/9)} ${y}Z" fill="${i%2?c1:c2}" opacity=".7"/>`}return o};
const gnd=(c)=>`<path d="M0 340Q200 320 385 335T770 330V420H0Z" fill="${c}"/>`;
const tag=(x,y,t,col,lx,ly)=>`<line x1="${lx}" y1="${ly}" x2="${x}" y2="${y}" stroke="${col}" stroke-opacity=".6"/><rect x="${x-4}" y="${y-14}" width="${t.length*6.4+12}" height="20" rx="10" fill="rgba(0,0,0,.55)" stroke="${col}"/><text x="${x+2}" y="${y}" fill="${col}" font-size="12" font-family="Alegreya Sans" font-weight="700">${t}</text>`;
const keyhint=`<rect x="300" y="384" width="170" height="26" rx="13" fill="rgba(0,0,0,.5)" stroke="#fff" stroke-opacity=".4"/><text x="318" y="402" fill="#f2c879" font-size="12" font-family="Cinzel" font-weight="700">HOLD Z</text><text x="380" y="402" fill="#fff" font-size="12">Sense magic</text>`;
const MS={
A(){let o=`<rect width="770" height="420" fill="#0b1a1f"/><rect width="770" height="420" fill="url(#bgT)" opacity=".4"/>`+stars(770,420,40,5)+gnd('#0a1216');
 o+=`<g filter="url(#blur3)">${flame(210,330,150,100,'#fff1b0','#ffb347',1)}${flame(530,330,300,200,'#ff4f8a','#7a3cff',3)}${flame(660,250,26,30,'#6a7a9a','#4a5a7a',5)}</g>`;
 o+=fig(210,330,1.3,'#0a1216')+fig(530,330,1.5,'#0a1216')+fig(660,250,.7,'#0a1216',.7);
 o+=`<circle cx="660" cy="214" r="22" fill="none" stroke="#7a8aaa" stroke-dasharray="3 4"/>`;
 o+=tag(250,70,'You · steady','#ffd98a',230,200)+tag(560,48,'Mage · overwhelming','#ff8ab8',545,160)+tag(480,110,'Something hidden · barely there','#9fb0d0',662,205);
 o+=`<rect x="14" y="14" width="190" height="24" rx="12" fill="rgba(0,0,0,.5)" stroke="#6fe3ff"/><text x="28" y="31" fill="#6fe3ff" font-size="12" font-family="Cinzel" font-weight="700">MANA SENSE ACTIVE</text>`+keyhint;return o},
B(){let o=`<rect width="770" height="420" fill="#07151a"/>`+stars(770,420,30,8)+gnd('#06110f');
 [[0,360,200,340,400,375,770,350],[0,395,240,372,500,400,770,380]].forEach(p=>o+=`<path d="M${p[0]} ${p[1]}C${p[2]} ${p[3]} ${p[4]} ${p[5]} ${p[6]} ${p[7]}" stroke="#4ef0b8" stroke-opacity=".6" stroke-width="2" fill="none" filter="url(#glow)" stroke-dasharray="10 8"/>`);
 const circ=(x,y,c,rx)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx*.22}" fill="none" stroke="${c}" stroke-width="1.5" filter="url(#glow)"/><ellipse cx="${x}" cy="${y}" rx="${rx*.7}" ry="${rx*.15}" fill="none" stroke="${c}" stroke-dasharray="3 4"/>`;
 o+=circ(210,338,'#8affd8',70)+circ(530,338,'#ffd27a',110)+circ(665,258,'#6a8a9a',24);
 const stream=(x0,y0,x1,y1,amp,n,c,r)=>{let s='';for(let i=0;i<n;i++){const t=i/n,x=x0+(x1-x0)*t+Math.sin(t*9+i)*amp*t,y=y0+(y1-y0)*t;s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r*(1-t*.6))}" fill="${c}" opacity="${f(1-t*.8)}"/>`}return s};
 o+=`<g filter="url(#glow)">${stream(210,260,170,60,30,40,'#8affd8',3)}${stream(215,260,260,70,40,40,'#bfffe9',2.4)}${stream(530,240,450,20,70,70,'#ffd27a',4)}${stream(535,240,640,30,60,70,'#ffb347',3.6)}${stream(665,215,650,150,6,14,'#8aa6b8',1.6)}</g>`;
 o+=fig(210,338,1.3,'#04100e')+fig(530,338,1.5,'#04100e')+fig(665,258,.7,'#04100e',.8);
 o+=tag(110,60,'You · steady, even flow','#8affd8',170,200)+tag(560,32,'Mage · dense, fast flow','#ffd27a',545,150)+tag(590,118,'Thin trickle · suppressed','#9fb6c8',655,200);
 o+=`<rect x="14" y="14" width="190" height="24" rx="12" fill="rgba(0,0,0,.5)" stroke="#4ef0b8"/><text x="28" y="31" fill="#4ef0b8" font-size="12" font-family="Cinzel" font-weight="700">LEY SIGHT ACTIVE</text>`+keyhint;return o},
C(){let o=`<rect width="770" height="420" fill="#120f22"/>`+stars(770,420,30,12)+gnd('#0b0918');
 o+=`<defs><linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2a4ae8"/><stop offset=".5" stop-color="#b03ad8"/><stop offset="1" stop-color="#ff8a2a"/></linearGradient><clipPath id="lens"><circle cx="500" cy="200" r="170"/></clipPath></defs>`;
 o+=fig(190,330,1.3,'#2a3a7a')+fig(660,250,.7,'#3a3a6a',.6);
 o+=`<g clip-path="url(#lens)"><rect x="330" y="30" width="340" height="340" fill="#0a0a1c"/><g filter="url(#blur3)"><ellipse cx="500" cy="200" rx="90" ry="140" fill="#ff8a2a" opacity=".35"/></g>${fig(500,330,1.5,'url(#heat)')}${fig(430,330,1.1,'#5a7aff',.95)}</g>`;
 o+=`<circle cx="500" cy="200" r="170" fill="none" stroke="#ffb067" stroke-width="2.5" filter="url(#glow)"/><circle cx="500" cy="200" r="158" fill="none" stroke="#ffb067" stroke-dasharray="2 6" stroke-opacity=".7"/>`;for(let i=0;i<36;i++){const a=pt(170,i*10,500,200),b=pt(i%3?176:184,i*10,500,200);o+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#ffb067" stroke-opacity=".8"/>`}
 o+=`<path d="M500 130v-20M500 270v20M430 200h-20M570 200h20" stroke="#ffd9a0" stroke-width="1.5"/>`;
 o+=`<rect x="26" y="40" width="250" height="150" rx="10" fill="rgba(20,14,40,.85)" stroke="#ffb067" stroke-opacity=".8"/><text x="42" y="64" fill="#ffb067" font-size="13" font-family="Cinzel" font-weight="700" letter-spacing=".1em">MANA SENSE</text><text x="42" y="86" fill="#fff" font-size="16" font-family="Almendra">Mage · Overwhelming</text>`;
 [['Output',.86,'#ff8a2a'],['Reserve',.6,'#b03ad8'],['Control',.35,'#4a6aff']].forEach(([n,v,c],i)=>o+=`<text x="42" y="${112+i*26}" fill="#cdbff0" font-size="12">${n}</text><rect x="104" y="${103+i*26}" width="150" height="9" rx="4.5" fill="#1a1236"/><rect x="104" y="${103+i*26}" width="${150*v}" height="9" rx="4.5" fill="${c}" filter="url(#glow)"/>`);
 o+=tag(190,255,'You · steady','#8ab0ff',190,260).replace(/<line.*?\/>/,'')+tag(620,160,'Hidden · ???','#9a9ab8',660,210)+keyhint;return o},
D(){let o=`<rect width="770" height="420" fill="#050d1c"/>`+stars(770,420,24,3)+gnd('#040a16');
 for(let i=1;i<=7;i++)o+=`<circle cx="210" cy="310" r="${i*70}" fill="none" stroke="#5ac8ff" stroke-opacity="${f(.55-i*.07)}" stroke-width="${f(2.4-i*.25)}"/>`;
 const outl=(x,y,s,c,dash='')=>`<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${c}" stroke-width="${1.6/s}" ${dash?`stroke-dasharray="${dash}"`:''} filter="url(#glow)"><path d="M-14 -52L0 -92L14 -52Z"/><ellipse cx="0" cy="-52" rx="24" ry="6"/><circle cx="0" cy="-42" r="11"/><path d="M-24 0L-12 -30H12L24 0Z"/></g>`;
 const rings=(x,y,n,c,r0,op)=>{let s='';for(let i=0;i<n;i++)s+=`<circle cx="${x}" cy="${y}" r="${r0+i*14}" fill="none" stroke="${c}" stroke-opacity="${f(op-i*op/(n+1))}" stroke-width="1.6" filter="url(#glow)"/>`;return s};
 o+=rings(210,258,3,'#8fe8ff',34,.9)+rings(530,238,6,'#ff9ad0',44,.9)+rings(660,205,1,'#6a86a8',16,.4);
 o+=outl(210,330,1.3,'#d8f6ff')+outl(530,330,1.5,'#ffd0e8')+outl(660,250,.7,'#6a86a8','3 4');
 o+=tag(60,60,'You · steady pulse','#8fe8ff',200,200)+tag(560,40,'Mage · wide, fast pulse','#ff9ad0',545,140)+tag(590,130,'Barely a ripple','#8ca0bc',655,200);
 o+=`<rect x="14" y="14" width="190" height="24" rx="12" fill="rgba(0,0,0,.5)" stroke="#5ac8ff"/><text x="28" y="31" fill="#5ac8ff" font-size="12" font-family="Cinzel" font-weight="700">PULSE SENSE ACTIVE</text>`+keyhint;return o}
};
const MN={A:['Aura Flames','Beings burn with an aura. Size is power, colour is nature. Suppressed mana shrinks to a faint ring.'],B:['Ley Streams','Mana flows as glowing particle streams and rune circles on the ground. Suppression thins the stream.'],C:['Scan Lens','A heat-vision lens with a readout panel: output, reserve and control. Most precise, least diegetic.'],D:['Sonar Pulse','Rings spread from you and outline beings. Strong casters ring wide, suppressed ones barely show.']};
function board3(){let h='<header><h1>Mana Sense</h1><span>Frieren-style · hold a key to perceive mana on yourself and others · 4 looks</span></header><div class="cols" style="grid-template-columns:1fr 1fr;gap:16px 20px">';
 ['A','B','C','D'].forEach(k=>{h+=`<div><div class="tile" style="height:420px">${S(W,H,MS[k]())}</div><div class="cap"><b>${k} · ${MN[k][0]}</b>${MN[k][1]}</div></div>`});return h+'</div>'}

const W=770,H=420,G='#d9b45a';const mult=L=>(1+L/50+Math.max(0,L-35)/25).toFixed(1);
/* ===== crosshair elements, each with 4 variants, all drawn around centre (120,120) ===== */
const EL={chant:{},win:{},lock:{},flight:{},ground:{},held:{}};
const ln=(a,b,c,w=1,extra='')=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
EL.chant.A=s=>{let o=`<g filter="url(#glow)"><circle cx="120" cy="120" r="46" fill="none" stroke="${G}" stroke-width="1.3"/>`;
 for(let i=0;i<24;i++)o+=ln(pt(46,i*15,120,120),pt(i%6?51:56,i*15,120,120),G,.8);
 if(s.p)o+=`<path d="${arc(54,0,Math.min(359,s.p*360),120,120)}" stroke="#ffe9a8" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 return o+`<circle cx="120" cy="120" r="2.6" fill="#fff"/></g>`};
EL.chant.B=s=>{const nd=[0,60,120,180,240,300].map(a=>pt(50,a,120,120)),lit=Math.floor((s.p||0)*6+.01);let o='<g filter="url(#glow)">';
 nd.forEach((p,i)=>{const q=nd[(i+1)%6];o+=ln(p,q,'#8fd0ff',i<lit-1?2:.8,`opacity="${i<lit-1?1:.3}"`)});
 nd.forEach((p,i)=>{o+=i<lit?star(p[0],p[1],5.5,'#e6f4ff'):`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="2.2" fill="#8fd0ff" opacity=".5"/>`});
 return o+`<path d="M120 112V128M112 120H128" stroke="#fff" stroke-width="1.3"/></g>`};
EL.chant.C=s=>{const rn='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃ';let o=`<g filter="url(#glow)"><circle cx="120" cy="120" r="38" fill="none" stroke="#b68cff" stroke-width="1.2"/>`;
 for(let i=0;i<12;i++){const a=i*30,p=pt(50,a,120,120);o+=`<text x="${f(p[0])}" y="${f(p[1])}" transform="rotate(${a} ${f(p[0])} ${f(p[1])})" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans Runic" font-size="15" fill="${i/12<(s.p||0)?'#ffd27a':'#6f5aa8'}">${rn[i]}</text>`}
 return o+`<circle cx="120" cy="120" r="2.4" fill="#fff"/></g>`};

 [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{const x=120+sx*d,y=120+sy*d;o+=`<path d="M${f(x)} ${f(y-sy*12)}V${f(y)}H${f(x-sx*12)}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`});
