<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;overflow:hidden;background:#0a0716;font-family:'Alegreya Sans',sans-serif;color:#efe6ff}
header{height:62px;padding:16px 30px 0;display:flex;align-items:baseline;gap:18px}

.colh{font-family:'Cinzel';font-size:12px;letter-spacing:.16em;color:#a999d6;text-align:center;padding-bottom:2px}
.row{display:grid;gap:10px;align-items:center}
.lab{padding-right:6px}.lab b{font-family:'Almendra';font-size:24px;color:#e7cbff;display:block;line-height:1}.lab i{font-family:'Cinzel';font-style:normal;color:#f2c879;font-size:13px;letter-spacing:.1em}.lab p{font-size:13px;color:#a999d6;margin-top:5px;line-height:1.25}
.tile{background:radial-gradient(ellipse at 50% 50%,#2a2060,#0d0a24);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tile svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:#cdbff0;padding:5px 2px 0;height:34px}.cap b{color:#f2c879;font-family:'Cinzel';letter-spacing:.08em;margin-right:6px}
.gl *{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<body><div id="app"></div>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

 <symbol id="g-weaver" viewBox="0 0 44 44"><path d="M5 36 C13 8,22 42,30 14 S41 22,40 9"/><circle cx="40" cy="9" r="3"/></symbol>

</defs></svg>
<script>
const P=Math.PI/180,f=n=>(+n).toFixed(1);
const pt=(r,a,cx,cy)=>[cx+r*Math.sin(a*P),cy-r*Math.cos(a*P)];
const arc=(r,a0,a1,cx=120,cy=120)=>{const p0=pt(r,a0,cx,cy),p1=pt(r,a1,cx,cy);return `M${f(p0[0])} ${f(p0[1])}A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${f(p1[0])} ${f(p1[1])}`};
const S=(w,h,inner,bg='')=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${bg}${inner}</svg>`;
const gly=(id,x,y,s,col)=>`<svg class="gl" x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" style="color:${col}"><use href="#${id}"/></svg>`;
const star=(x,y,r,col,op=1)=>`<path d="M${x} ${y-r}L${x+r*.28} ${y-r*.28}L${x+r} ${y}L${x+r*.28} ${y+r*.28}L${x} ${y+r}L${x-r*.28} ${y+r*.28}L${x-r} ${y}L${x-r*.28} ${y-r*.28}Z" fill="${col}" opacity="${op}"/>`;
const stars=(w,h,n,seed)=>{let s=seed,o='';const R=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let i=0;i<n;i++)o+=`<circle cx="${f(R()*w)}" cy="${f(R()*h)}" r="${f(.4+R()*1.1)}" fill="#fff" opacity="${f(.2+R()*.6)}"/>`;return o};
const tileBg=(w,h,seed)=>`<rect width="${w}" height="${h}" fill="url(#bgT)"/>`+stars(w,h,50,seed)+`<path d="M0 ${h-40} Q${w*.3} ${h-70} ${w*.5} ${h-45} T${w} ${h-55} V${h}H0Z" fill="#120c30" opacity=".8"/>`;
const enemy=(x,y,s,c='#1a1030')=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="22" ry="14" fill="${c}"/><path d="M-20 -4L-60 -22L-34 6ZM20 -4L60 -22L34 6Z" fill="${c}"/><circle cx="-6" cy="-3" r="2.5" fill="#ff5a7a"/><circle cx="6" cy="-3" r="2.5" fill="#ff5a7a"/></g>`;
const fig=(x,y,s,c,op=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" opacity="${op}"><path d="M-14 -52L0 -92L14 -52Z"/><ellipse cx="0" cy="-52" rx="24" ry="6"/><circle cx="0" cy="-42" r="11"/><path d="M-24 0L-12 -30H12L24 0Z"/></g>`;
const row=(cols,n)=>`display:grid;grid-template-columns:${cols}`;

/* ====== 1. CROSSHAIR + HELD CAST ====== */
const ST=[{n:'IDLE',p:0,lock:0,perf:0,held:0,fl:2},{n:'CHANTING',p:.55,lock:0,perf:0,held:0,fl:2},{n:'PERFECT + LOCKED ON',p:.78,lock:1,perf:1,held:0,fl:3},{n:'HELD CAST READY',p:.5,lock:0,perf:0,held:1,fl:2}];
const WA=[259,302];
const XH={
A(s){const g='#d9b45a',cy='#6fe3ff';let o='<g filter="url(#glow)">';
 o+=`<circle cx="120" cy="120" r="46" fill="none" stroke="${g}" stroke-width="1.3"/>`;
 for(let i=0;i<24;i++){const a=i*15,p0=pt(46,a,120,120),p1=pt(i%6?51:56,a,120,120);o+=`<line x1="${f(p0[0])}" y1="${f(p0[1])}" x2="${f(p1[0])}" y2="${f(p1[1])}" stroke="${g}" stroke-width=".8"/>`}
 o+=`<path d="${arc(54,WA[0],WA[1])}" stroke="${s.perf?'#fff':g}" stroke-width="${s.perf?9:6}" fill="none" opacity="${s.perf?1:.5}" stroke-linecap="round"/>`;
 if(s.p)o+=`<path d="${arc(54,0,Math.min(359,s.p*360))}" stroke="#ffe9a8" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 if(s.lock){[45,135,225,315].forEach(a=>o+=`<path d="${arc(72,a-13,a+13)}" stroke="${cy}" stroke-width="3" fill="none" stroke-linecap="round"/>`);}
 for(let i=0;i<5;i++){const p=pt(80,212+i*12,120,120);o+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="3" fill="${i<s.fl?g:'none'}" stroke="${g}" stroke-width="1"/>`}
 o+=`<circle cx="120" cy="120" r="2.6" fill="#fff"/></g>`;
 if(s.held){o+=`<circle cx="120" cy="44" r="22" fill="url(#orbG)"/><polygon points="120,36 127,40 127,48 120,52 113,48 113,40" fill="none" stroke="${g}" stroke-width="1.4"/><circle cx="120" cy="44" r="3" fill="#fff"/>`;o+=`<g stroke="#ffe9a8" stroke-width="2.4"><line x1="${f(pt(54,s.p*360,120,120)[0]-2)}" y1="${f(pt(54,s.p*360,120,120)[1]-5)}" x2="${f(pt(54,s.p*360,120,120)[0]-2)}" y2="${f(pt(54,s.p*360,120,120)[1]+5)}"/><line x1="${f(pt(54,s.p*360,120,120)[0]+3)}" y1="${f(pt(54,s.p*360,120,120)[1]-5)}" x2="${f(pt(54,s.p*360,120,120)[0]+3)}" y2="${f(pt(54,s.p*360,120,120)[1]+5)}"/></g>`}
 else o+=`<polygon points="120,40 125,44 125,50 120,54 115,50 115,44" fill="none" stroke="${g}" stroke-width="1" opacity=".35"/>`;
 return o},
B(s){const nd=[0,60,120,180,240,300].map(a=>pt(50,a,120,120));const lit=Math.floor(s.p*6+.01);let o='<g filter="url(#glow)">';
 nd.forEach((p,i)=>{const q=nd[(i+1)%6];o+=`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="#8fd0ff" stroke-width="${i<lit-1?2:.8}" opacity="${i<lit-1?1:.3}"/>`});
 nd.forEach((p,i)=>{const on=i<lit;o+=on?star(p[0],p[1],i==5&&s.perf?13:5,'#e6f4ff'):`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="2.2" fill="#8fd0ff" opacity=".5"/>`});
 if(s.perf)o+=star(nd[5][0],nd[5][1],19,'#fff6c8',.9);

 if(s.lock){o+=`<polygon points="120,40 200,120 120,200 40,120" fill="none" stroke="#9ad9ff" stroke-width="1.2" stroke-dasharray="3 4"/>`+[[120,40],[200,120],[120,200],[40,120]].map(p=>star(p[0],p[1],6,'#fff')).join('')}
 for(let i=0;i<5;i++)o+=`<circle cx="214" cy="${178-i*16}" r="3" fill="${i<s.fl?'#e6f4ff':'none'}" stroke="#8fd0ff" stroke-width="1"/>`;
 o+=`<path d="M120 112V128M112 120H128" stroke="#fff" stroke-width="1.3"/></g>`;

 return o},
C(s){let o='<g filter="url(#glow)">';const rn='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃ';
 o+=`<circle cx="120" cy="120" r="38" fill="none" stroke="#b68cff" stroke-width="1.2"/>`;
 for(let i=0;i<12;i++){const a=i*30,p=pt(50,a,120,120),on=i/12<s.p;o+=`<text x="${f(p[0])}" y="${f(p[1])}" transform="rotate(${a} ${f(p[0])} ${f(p[1])})" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans Runic" font-size="15" fill="${on?'#ffd27a':'#6f5aa8'}">${rn[i]}</text>`}
 o+=`<path d="${arc(63,WA[0],WA[1])}" stroke="${s.perf?'#fff':'#ffd27a'}" stroke-width="${s.perf?5:2}" fill="none" opacity="${s.perf?1:.6}" stroke-linecap="round"/>`;
 if(s.perf)o+=`<circle cx="120" cy="120" r="63" fill="none" stroke="#ffd27a" stroke-width="1.2"/>`;
 if(s.lock)o+=`<polygon points="120,36 204,120 120,204 36,120" fill="none" stroke="#ff7ad9" stroke-width="1.6"/>`+[[120,36],[204,120],[120,204],[36,120]].map(p=>`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans Runic" font-size="13" fill="#ff7ad9">ᛉ</text>`).join('');

 if(s.held){o+=`<polygon points="120,100 137,110 137,130 120,140 103,130 103,110" fill="rgba(182,140,255,.25)" stroke="#ffd27a" stroke-width="1.6"/><svg class="gl" x="104" y="104" width="32" height="32" style="color:#fff3c8"><use href="#g-weaver"/></svg>`;for(let i=0;i<6;i++){const a=pt(25,i*60+30,120,120),b=pt(30,i*60+30,120,120);o+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#ffd27a" stroke-width="2"/>`}}
 else o+=`<circle cx="120" cy="120" r="2.4" fill="#fff"/>`;
 return o+'</g>'},
D(s){const d=s.p?30-18*s.p:30,gold=s.perf,col=gold?'#ffd75e':'#fff';let o='<g filter="url(#glow)">';
 if(s.p)o+=`<rect x="${120-16}" y="${120-16}" width="32" height="32" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="2 3" opacity=".5"/>`;
 [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{const x=120+sx*d,y=120+sy*d;o+=`<path d="M${x-sx*0} ${y+(-sy)*-12*-1}V${y}H${x-sx*12}" fill="none" stroke="${col}" stroke-width="${gold?3:2}" stroke-linecap="round"/>`.replace(`V${y}H${x-sx*12}`,`V${y}H${x-sx*12}`)});
 o+=`<circle cx="120" cy="120" r="2" fill="${col}"/>`;
 if(s.lock){o+=`<polygon points="120,58 182,120 120,182 58,120" fill="none" stroke="#7ff0d0" stroke-width="1.6"/><text x="120" y="52" text-anchor="middle" font-family="Rajdhani" font-weight="700" font-size="13" fill="#7ff0d0">32 m</text>`}
 for(let i=0;i<4;i++)o+=`<path d="M${196} ${150-i*10}l6 -5 l6 5" fill="none" stroke="#fff" stroke-width="1.8" opacity="${i<s.fl?1:.25}"/>`;
 for(let i=0;i<3;i++){const x=104+i*16;o+=`<path d="M${x} 172l6 -6 6 6 -6 6z" fill="${i<s.held?'#ffd75e':'none'}" stroke="#fff" stroke-width="1.2" opacity="${i<s.held?1:.4}"/>`}
 return o+'</g>'}
};
const XNAMES={A:['Astrolabe Ring','Gold rings, a sweeping window and a docked orb.'],B:['Constellation','Stars light as you chant. The held spell is a captive star.'],C:['Rune Sigil','A small circle whose runes ignite. The held spell is sealed in the centre.'],D:['Clean Brackets','Minimal. Brackets close on a target square. Pips show held spells.']};
function board1(){let h='<header><h1>Crosshair + Held Cast</h1><span>4 styles · each shows chant progress, the perfect-cast window, lock-on, flight level and held cast</span></header>';
 h+=`<div class="cols" style="grid-template-columns:220px repeat(4,1fr)"><div></div>${ST.map(s=>`<div class="colh">${s.n}</div>`).join('')}</div>`;
 ['A','B','C','D'].forEach((k,ri)=>{h+=`<div class="cols row" style="grid-template-columns:220px repeat(4,1fr);margin-top:8px"><div class="lab"><i>${k}</i><b>${XNAMES[k][0]}</b><p>${XNAMES[k][1]}</p></div>`+ST.map((s,i)=>`<div class="tile" style="height:208px">${S(240,240,(s.lock?enemy(120,120,.9,'#2a1a55'):'')+XH[k](s),tileBg(240,240,ri*10+i+3))}</div>`).join('')+'</div>'});
 return h}

/* ====== 2. GAMEPLAY HUD ====== */
const W=770,H=420;
const scene=()=>`<rect width="770" height="420" fill="url(#sky)"/><circle cx="560" cy="250" r="90" fill="#ffd9b0" opacity=".35"/><path d="M0 330L90 250L170 310L270 220L380 320L470 260L580 330L680 240L770 300V420H0Z" fill="#4b3a86" opacity=".8"/><path d="M0 370L120 320L240 360L360 330L500 370L640 335L770 365V420H0Z" fill="#2a2058"/><ellipse cx="150" cy="120" rx="80" ry="14" fill="#fff" opacity=".22"/><ellipse cx="640" cy="90" rx="100" ry="16" fill="#fff" opacity=".18"/>
<g transform="translate(385 250)"><path d="M-70 26L70 10" stroke="#241540" stroke-width="5" stroke-linecap="round"/><path d="M-70 26l-26 -6M-70 26l-26 6M-70 26l-24 14" stroke="#c99a5a" stroke-width="2.5"/><path d="M-12 -36L4 -78L18 -36Z" fill="#1c1040"/><ellipse cx="3" cy="-36" rx="26" ry="6" fill="#1c1040"/><circle cx="4" cy="-28" r="10" fill="#e8c8b0"/><path d="M-14 -20L-26 14L20 12L18 -18Z" fill="#241540"/></g>`+enemy(590,140,1);
const glass=(x,y,w,h,r=10)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="rgba(40,22,90,.6)" stroke="#c79bff" stroke-opacity=".7"/>`;
const HUD={
A(){let o='';o+=`<circle cx="385" cy="235" r="90" fill="url(#orbV)" opacity=".45" filter="url(#blur8)"/><circle cx="455" cy="262" r="26" fill="url(#orbC)"/>`;

 o+=`<text x="385" y="16" fill="#fff" fill-opacity=".8" font-size="11" text-anchor="middle" font-family="Cinzel">N</text><path d="M430 34l5 -8 5 8z" fill="#ffd27a"/>`;

 ['g-weaver','g-moon','g-bloom','g-step','g-lantern'].forEach((g,i)=>{const p=pt(56,40+i*26,455,262);o+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${i?10:13}" fill="rgba(30,15,70,.5)" stroke="#fff" stroke-opacity="${i?.4:.9}"/>`+gly(g,p[0],p[1],i?12:16,'#fff')});

B(){let o='';o+=glass(235,10,300,34,17)+`<line x1="260" y1="27" x2="510" y2="27" stroke="#c79bff" stroke-opacity=".4"/><text x="385" y="22" fill="#f2c879" font-size="11" text-anchor="middle" font-family="Cinzel">N</text><path d="M425 36l5 -8 5 8z" fill="#ffd27a"/><circle cx="470" cy="28" r="3" fill="#ff6b8a"/>`;
 o+=glass(16,10,215,74)+`<path d="M38 36l4 9 10 1 -7 6 2 10 -9 -5 -9 5 2 -10 -7 -6 10 -1z" fill="none" stroke="#f2c879" stroke-width="1.4" transform="translate(-6 -10) scale(.9)"/><text x="62" y="32" fill="#fff" font-size="16" font-family="Almendra">The Teacher's Task</text><text x="62" y="49" fill="#cdbff0" font-size="12">Next: bring three glowcaps</text><rect x="62" y="60" width="150" height="7" rx="3.5" fill="#1a1040"/><rect x="62" y="60" width="108" height="7" rx="3.5" fill="#6fe3ff"/><text x="186" y="57" fill="#6fe3ff" font-size="11">72%</text>`;

 for(let i=0;i<7;i++){const x=234+i*44,y=360;o+=`<rect x="${x}" y="${y}" width="38" height="38" rx="9" fill="rgba(40,22,90,.65)" stroke="${i?'#c79bff':'#fff'}" stroke-opacity="${i?.5:1}" ${i?'':'filter="url(#glow)"'}/>`+(gs[i]?gly(gs[i],x+19,y+19,22,i?'#d9c2ff':'#fff'):'')+`<text x="${x+19}" y="${y+50}" fill="#f2c879" font-size="9" text-anchor="middle" font-family="Cinzel">${ks[i]}</text>`}
